<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14151c" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(243, 183, 110, 0.4)" />
      <stop offset="50%" stop-color="rgba(138, 66, 255, 0.3)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
  </defs>
  <!-- Background with subtle brand border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- AD Monogram -->
  <text x="14" y="42" font-family="'Syne', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.04em">AD</text>
  
  <!-- Signature Glowing Dot -->
  <circle cx="51" cy="40" r="3.5" fill="#f3b76e" />
  <circle cx="51" cy="40" r="6" fill="#f3b76e" opacity="0.25" />
</svg>